<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="La muerte de mis 20 puede esperar. La mudanza, no. Nueva fecha y ubicación próximamente.">
  <meta property="og:title" content="La China cumple 30 — Comunicado">
  <meta property="og:description" content="La muerte de mis 20 puede esperar. La mudanza, no. Nueva fecha y ubicación próximamente.">
  <title>La China cumple 30 — Comunicado</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
    body { min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
    .frame { position: relative; width: min(100vw, 177.7778svh); aspect-ratio: 16 / 9; }
    .lace { display: block; width: 100%; height: 100%; object-fit: contain; }
    .announcement { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .announcement picture { display: block; width: 61%; }
    .announcement img { display: block; width: 100%; height: auto; }
    @media (max-width: 767px) {
      .frame { width: min(100vw, 56.25svh); aspect-ratio: 9 / 16; }
      .announcement picture { width: 76%; }
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="Comunicado de los 30 de la China">
    <picture>
      <source media="(max-width: 767px)" srcset="FONDOVERTICAL.jpeg">
      <img class="lace" src="FONDO.jpeg" alt="Marco de encaje blanco sobre fondo negro">
    </picture>
    <div class="announcement">
      <picture>
        <source media="(max-width: 767px)" srcset="COMUNICADO-VERTICAL.png">
        <img src="COMUNICADO-HORIZONTAL.png" alt="La China cumple 30. La muerte de mis 20 puede esperar. La mudanza, no. Nueva fecha y ubicación próximamente.">
      </picture>
    </div>
  </main>
</body>
</html>
